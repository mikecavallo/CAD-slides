<!doctype html>
<!-- Weekly Tally Sheet: printable client handout (US Letter), matching the sheet in the Management: Solutions and
     Setups deck. Build: node handouts/build.mjs  ->  out/Weekly-Tally-Sheet.pdf and .png -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weekly Tally Sheet</title>
<style>
  @font-face { font-family: 'Rubik'; font-weight: 700; src: url('../assets/fonts/Rubik-700.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 500; src: url('../assets/fonts/Montserrat-500.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 600; src: url('../assets/fonts/Montserrat-600.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 700; src: url('../assets/fonts/Montserrat-700.woff2') format('woff2'); }
  @page { size: 8.5in 11in; margin: 0; }
  :root {
    --deep: #233a12; --head: #2f5216; --line: #dde5d3; --pale: #e4eed8; --total: #b8d99a; --mist: #f3f7ee; --soft: #5b6650; --green: #619537;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { width: 8.5in; height: 11in; padding: 0.45in 0.5in 0.4in; display: flex; flex-direction: column;
    font-family: 'Montserrat', sans-serif; color: var(--deep); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 0.16in; }
  header img { width: 1.75in; display: block; }
  header h1 { font: 700 27pt/1 'Rubik', sans-serif; color: var(--deep); letter-spacing: -0.2pt; margin-bottom: 0.06in; }

  .week { margin-top: 0.14in; }
  .date { display: flex; align-items: flex-end; gap: 0.08in; height: 0.3in; margin-bottom: 0.07in;
    font: 600 9.5pt/1 'Montserrat', sans-serif; color: var(--soft); letter-spacing: 0.6pt; text-transform: uppercase; }
  .date .blank { width: 0.6in; border-bottom: 1.2px solid var(--line); height: 0.22in; }
  .date .slash { font: 500 14pt/1 'Montserrat', sans-serif; color: var(--soft); padding-bottom: 0.02in; }
  .date .lab { padding-bottom: 0.03in; margin-right: 0.04in; }

  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed;
    border: 1.5px solid var(--line); border-radius: 0.12in; overflow: hidden; }
  col.beh { width: 1.85in; } col.tot { width: 0.98in; }
  th { height: 0.4in; background: var(--pale); font: 700 12.5pt/1 'Rubik', sans-serif; color: var(--head); text-align: center; }
  th:first-child { text-align: left; padding-left: 0.16in; }
  th.tot { background: var(--total); }
  td { height: 0.44in; border-top: 1.2px solid var(--line); }
  td + td, th + th { border-left: 1.2px solid var(--line); }
  td.tot { background: var(--mist); }

  .notes { flex: 1; display: flex; flex-direction: column; margin-top: 0.24in; min-height: 0; }
  .notes h2 { font: 700 13pt/1 'Montserrat', sans-serif; letter-spacing: 1.6pt; color: var(--deep); margin-bottom: 0.05in; }
  .notes .hint { font: 500 8.5pt/1.3 'Montserrat', sans-serif; color: var(--soft); margin-bottom: 0.02in; }
  .notes .box { flex: 1; margin-top: 0.06in; border: 2px solid var(--green); border-radius: 0.12in; }

  footer { margin-top: 0.12in; font: 500 8.5pt/1 'Montserrat', sans-serif; letter-spacing: 1pt; color: var(--soft); text-transform: uppercase; }
</style>
</head>
<body>
  <header>
    <img src="../assets/img/logo.png" alt="Calling All Dogs">
    <h1>Weekly Tally Sheet</h1>
  </header>

  <!-- three weekly grids, as on the deck's sheet -->
  <div id="weeks"></div>

  <section class="notes">
    <h2>NOTES</h2>
    <div class="hint">Weather, visitors, schedule changes, anything new that week.</div>
    <div class="box"></div>
  </section>

  <footer>callingalldogsny.com · © Tori Ganino, Calling All Dogs, LLC</footer>

<script>
  const DAYS = ['Su', 'M', 'T', 'W', 'Th', 'F', 'S'], ROWS = 3;
  const week = () => `
    <section class="week">
      <div class="date"><span class="lab">Week of</span><span class="blank"></span><span class="slash">/</span><span class="blank"></span></div>
      <table>
        <colgroup><col class="beh">${DAYS.map(() => '<col>').join('')}<col class="tot"></colgroup>
        <tr><th>Behavior</th>${DAYS.map(d => `<th>${d}</th>`).join('')}<th class="tot">Total</th></tr>
        ${Array.from({ length: ROWS }, () => `<tr><td></td>${DAYS.map(() => '<td></td>').join('')}<td class="tot"></td></tr>`).join('')}
      </table>
    </section>`;
  document.getElementById('weeks').innerHTML = week() + week() + week();
</script>
</body>
</html>
